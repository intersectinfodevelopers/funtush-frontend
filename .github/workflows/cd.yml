name: CD - Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  APP_DIR: /home/rituraj/app/funtush-frontend

jobs:
  deploy:
    name: Automatic Production Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_rsa \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "hostname && whoami && docker --version && docker compose version"

      - name: Deploy to Production
        run: |
          ssh -i ~/.ssh/id_rsa \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

          set -Eeuo pipefail

          cd /home/rituraj/app/funtush-frontend

          echo "======================================"
          echo "1. Pull latest code"
          echo "======================================"

          git fetch origin main
          git reset --hard origin/main

          echo "======================================"
          echo "2. Build frontend image"
          echo "======================================"

          docker compose build frontend

          echo "======================================"
          echo "3. Start frontend"
          echo "======================================"

          docker compose up -d frontend

          echo "======================================"
          echo "4. Ensure Nginx is running"
          echo "======================================"

          docker compose up -d nginx

          echo "======================================"
          echo "5. Container status"
          echo "======================================"

          docker compose ps

          echo "======================================"
          echo "6. Health check"
          echo "======================================"

          sleep 10

          if curl -fsS http://localhost:80 > /dev/null; then
              echo "Frontend is LIVE"
          else
              echo "Deployment failed"

              docker compose ps
              docker compose logs --tail=100 frontend
              docker compose logs --tail=100 nginx

              exit 1
          fi

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          EOF
